<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - منصة تكوين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="booking-body">

    <div class="booking-container">
        <div class="booking-header">
            <h2>حجز موعد استشارة</h2>
            <p>اختاري التاريخ والوقت المناسب لمناقشة تفاصيل مشروعك</p>
        </div>

        <form class="booking-form">
            <div class="input-group">
                <label>نوع الاستشارة</label>
                <select required>
                    <option value="" disabled selected>اختاري نوع الخدمة</option>
                    <option value="ui">تصميم واجهات المستخدم (UI/UX)</option>
                    <option value="dev">تطوير وبرمجة المنصات</option>
                    <option value="strategy">استراتيجية المشروع</option>
                </select>
            </div>

            <div class="input-group">
                <label>تاريخ الموعد</label>
                <input type="date" required>
            </div>

            <div class="input-group">
                <label>الوقت المناسب</label>
                <input type="time" required>
            </div>

            <button type="submit" class="booking-btn">تأكيد حجز الموعد</button>
        </form>

        <div class="booking-footer">
            <a href="index.html">العودة إلى لوحة التحكم</a>
        </div>
    </div>

</body>
</html>
