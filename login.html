<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة تكوين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p>أهلاً بكِ مجدداً، أدخلي بيانات حسابك للمتابعة</p>
        </div>

        <form class="login-form">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="********" required>
            </div>

            <a href="index.html" class="login-btn">دخول إلى لوحة التحكم</a>
        </form>

        <div class="login-footer">
            
        </div>
        <div class="signup-options" style="margin-top: 15px; text-align: center;">
    <span>ليس لديكِ حساب؟ </span>
    <a href="register-phone.html" style="color: #4f46e5; font-weight: bold; text-decoration: none;">التسجيل برقم الجوال</a>
    <br>
    <a href="welcome.html" style="color: #6b7280; text-size: 0.9em; text-decoration: underline; margin-top: 5px; display: inline-block;">العودة للترحيب</a>
</div>
    </div>

</body>
</html>
