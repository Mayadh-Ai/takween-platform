<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع الإلكتروني - منصة تكوين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body <div class="checkout-container">

    <div class="checkout-header">
        <h2>إتمام الدفع الإلكتروني</h2>
        <p>اختاري طريقة الدفع المناسبة لإكمال اشتراكك</p>
    </div>

    <div class="payment-card">

        <div class="payment-icon"></div>

        <h3>Apple Pay</h3>
        <p class="payment-description">
            طريقة دفع سهلة وسريعة وآمنة
        </p>

        <div class="amount-box">
            <span>المبلغ الإجمالي</span>
            <h2>299 <small>ريال سعودي</small></h2>
        </div>

        <div class="apple-pay-mark">
            <span> Pay</span>
        </div>

        <button class="demo-pay-btn" onclick="showDemoMessage()">
            متابعة للتجربة
        </button>

        <p class="demo-note">
            هذه واجهة تجريبية ولا يتم خصم أي مبلغ
        </p>

    </div>

    <a href="index.html" class="back-link">
        العودة إلى الصفحة الرئيسية
    </a>

</div>

<div id="demoMessage" class="demo-message">
    <div class="success-icon">✓</div>
    <h3>تمت التجربة بنجاح!</h3>
    <p>هذه عملية دفع تجريبية من منصة TAKWEEN.</p>
    <button onclick="closeDemoMessage()">حسناً</button>
</div>

<script>
function showDemoMessage() {
    document.getElementById("demoMessage").style.display = "block";
}

function closeDemoMessage() {
    document.getElementById("demoMessage").style.display = "none";
}
</script>
</body>
</html>
