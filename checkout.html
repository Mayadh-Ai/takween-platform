<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع الإلكتروني - منصة تكوين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-body">

    <div class="checkout-container">
        <div class="checkout-header">
            <h2>إتمام الدفع الإلكتروني</h2>
            <p>Appel Pay</p>
        </div>

        <form class="checkout-form">
            <div class="input-group">
                <label>اسم حامل البطاقة</label>
                <input type="text" placeholder="الاسم كما هو مكتوب على البطاقة" required>
            </div>

            <div class="input-group">
                <label>رقم البطاقة</label>
                <input type="text" placeholder="xxxx xxxx xxxx xxxx" maxlength="19" required>
            </div>

            <div class="card-details-row">
                <div class="input-group">
                    <label>تاريخ الانتهاء</label>
                    <input type="text" placeholder="MM/YY" required>
                </div>
                <div class="input-group">
                    <label>رمز الأمان (CVV)</label>
                    <input type="password" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <button type="submit" class="checkout-btn">إتمام الدفع بقيمة 299 ر.س</button>
        </form>

        <div class="checkout-footer">
            <a href="index.html">العودة إلى لوحة التحكم</a>
        </div>
    </div>

</body>
</html>
